{% extends 'base.html' %}
{% block head %}
<style>
  .month-container { margin-bottom:32px; }
  .game-tile { position:relative; overflow:hidden; }
  .game-tile .bg-logo { position:absolute; inset:0; background-position:center; background-repeat:no-repeat; background-size:85%; opacity:0.3; filter:grayscale(100%) contrast(120%); pointer-events:none; }
  .game-tile .game-date { position:absolute; top:4px; left:6px; font-size:10px; opacity:.85; z-index:2; color:inherit; }
  .game-tile .matchup { position:absolute; left:8px; bottom:6px; font-weight:600; font-size:.9rem; z-index:2; }
  .game-tile .score-line { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.5rem; font-weight:700; text-align:center; line-height:1.1; z-index:2; white-space:nowrap; }
  .game-tile .status-chip { position:absolute; right:6px; bottom:6px; z-index:2; }
  /* Smaller card height */
  .calendar-grid .game-tile { aspect-ratio:7/5 !important; }
  /* Month controls: custom dropdown title centered between arrow buttons */
  #monthControls { position:relative; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:.5rem; margin:0 0 1rem 0; }
  #monthControls .month-nav-btn { width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; background:var(--panel-alt); border:1px solid #2a3142; color:var(--value-text, var(--text)); border-radius:999px; font-weight:600; cursor:pointer; justify-self:end; transition:background .18s ease, transform .18s ease, border-color .18s ease; }
  #monthControls .month-nav-btn .icon { width:18px; height:18px; }
  #monthControls .month-nav-btn.next { justify-self:start; }
  #monthControls .month-nav-btn:hover:not(:disabled){ background:var(--panel); border-color:#3a4560; transform:translateY(-1px); }
  #monthControls .month-nav-btn:disabled { opacity:.35; cursor:default; }
  #monthControls .month-title-wrap { position:relative; }
  #monthControls .month-title-btn { position:relative; display:inline-flex; align-items:center; justify-content:center; font-size:28px; font-weight:600; letter-spacing:1px; background:transparent; border:none; color:var(--text); padding:6px 38px; cursor:pointer; line-height:1.15; }
  #monthControls .month-title-btn:hover { color:#fff; }
  #monthControls .month-title-label { text-align:center; }
  #monthControls .month-title-btn .chev { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:16px; height:16px; opacity:.6; transition:transform .18s ease; }
  #monthControls .month-title-btn[aria-expanded="true"] .chev { transform:translateY(-50%) rotate(180deg); }
  #monthControls .month-menu { position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%); z-index:300; min-width:230px; max-height:320px; overflow:auto; background:#111827; border:1px solid #2a3142; border-radius:14px; box-shadow:0 18px 40px rgba(0,0,0,0.45); padding:6px; scrollbar-width:thin; }
  #monthControls .month-menu[hidden]{ display:none; }
  #monthControls .month-menu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--text); padding:9px 12px; border-radius:8px; font-size:14px; font-weight:650; cursor:pointer; white-space:nowrap; }
  #monthControls .month-menu button:hover { background:rgba(255,255,255,0.06); }
  #monthControls .month-menu button.active { background:rgba(77,163,255,0.14); outline:1px solid rgba(77,163,255,0.45); outline-offset:-1px; color:#eaf4ff; }

  /* Mobile schedule table */
  .schedule-grid-root{ display:block; }
  .schedule-table-root{ display:none; }
  .schedule-table-wrap{ width:100%; overflow:auto; border:1px solid #232a3a; border-radius:12px; background:rgba(255,255,255,0.02); }
  .schedule-table{ width:100%; border-collapse:collapse; font-size:14px; }
  .schedule-table th{ position:sticky; top:0; background:#0f1522; text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.8px; padding:10px 10px; color:var(--text-dim); font-weight:900; border-bottom:1px solid #222b37; }
  .schedule-table td{ padding:10px 10px; border-bottom:1px solid #1a2230; vertical-align:middle; }
  .schedule-table td.num{ text-align:right; font-variant-numeric: tabular-nums; }
  .schedule-table a{ color:inherit; text-decoration:none; font-weight:800; }
  .schedule-table a:hover{ text-decoration:underline; }
  .schedule-table tbody tr{ cursor:pointer; }
  .schedule-table tbody tr:hover{ filter:brightness(1.06); }
  .chip{ display:inline-flex; align-items:center; gap:8px; padding:5px 10px; border-radius:999px; border:1px solid rgba(255,255,255,0.16); background:rgba(0,0,0,0.18); font-weight:850; font-size:12px; letter-spacing:.2px; }

  @media (max-width: 980px){
    .schedule-grid-root{ display:none; }
    .schedule-table-root{ display:block; }
    #monthControls{ gap:.4rem !important; }
    #monthControls .month-title-btn{ font-size:20px; padding:6px 30px; }
    #monthControls .month-title-btn .chev{ right:6px; width:14px; height:14px; }
    #monthControls .month-nav-btn{ width:38px; height:38px; }
  }
</style>
{% endblock %}
{% block content %}
<div id="monthControls"></div>
<div id="scheduleRoot">
  <div id="scheduleGridRoot" class="schedule-grid-root"></div>
  <div id="scheduleTableRoot" class="schedule-table-root"></div>
</div>
<div id="scheduleLegend" style="margin-top:8px; font-size:16px; display:flex; gap:32px; align-items:center; justify-content:center; flex-wrap:wrap; font-weight:600;"></div>
<script id="teams-data" type="application/json">{{ teams|tojson|safe }}</script>
{% endblock %}
{% block scripts %}
<script>
// Load teams JSON embedded in a non-JS script tag to keep template parsers happy
const teams = JSON.parse(document.getElementById('teams-data').textContent);
const teamSelect = document.getElementById('teamSelect');
const seasonSelect = document.getElementById('seasonSelect');
const seasonStateSelect = document.getElementById('seasonStateSelect');
const scheduleGridRoot = document.getElementById('scheduleGridRoot');
const scheduleTableRoot = document.getElementById('scheduleTableRoot');
let seasonMeta = window.__seasonMeta || [];

function lightenDarken(hex, factor){
  hex = hex.replace('#','');
  let r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  if(factor>1){r=r+(255-r)*(factor-1); g=g+(255-g)*(factor-1); b=b+(255-b)*(factor-1);} else {r*=factor; g*=factor; b*=factor;}
  r=Math.min(255,Math.max(0,Math.round(r))); g=Math.min(255,Math.max(0,Math.round(g))); b=Math.min(255,Math.max(0,Math.round(b)));
  return '#' + r.toString(16).padStart(2,'0') + g.toString(16).padStart(2,'0') + b.toString(16).padStart(2,'0');
}

function isLight(hex){
  hex=hex.replace('#','');
  let r=parseInt(hex.substring(0,2),16), g=parseInt(hex.substring(2,4),16), b=parseInt(hex.substring(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>155;
}

let currentFilteredGames = [];
let monthMeta = []; // [{key, year, month, label}]
let currentMonthIndex = 0;
let __monthMenuDocHandler = null;

function getScheduleSelectedSeasons(){
  const selected = (typeof window.getSelectedSeasonValues === 'function')
    ? window.getSelectedSeasonValues()
    : [String(seasonSelect?.value || '').trim()];
  return selected.filter(season => /^\d{8}$/.test(season));
}

async function loadSchedule(){
  const team = teamSelect.value;
  const seasons = getScheduleSelectedSeasons();
  if(!team || !seasons.length) return;
  if(scheduleGridRoot) scheduleGridRoot.innerHTML = '<p>Loading schedule...</p>';
  if(scheduleTableRoot) scheduleTableRoot.innerHTML = '<p>Loading schedule...</p>';
  const payloads = await Promise.all(seasons.map(async (season)=>{
    try{
      const r = await fetch(`/api/schedule/${team}/${season}`);
      if(!r.ok) return [];
      const js = await r.json();
      return Array.isArray(js) ? js : [];
    }catch(_){
      return [];
    }
  }));
  let games = payloads.flat();
  console.debug('Raw schedule sample:', games.slice(0,3));
  // Exclude preseason (gameType 1)
  games = games.filter(g=> String(g.gameType) !== '1');
  // Normalize gameType: 2->R, 3->P (others kept)
  games = games.map(g=>{
    const raw = String(g.gameType).toUpperCase();
    const norm = (raw==='2'||raw==='R') ? 'R' : (raw==='3'||raw==='P') ? 'P' : raw;
    return { ...g, gameType: norm };
  });
  const state = seasonStateSelect.value; // '2' regular, '3' playoffs
  const want = state==='2' ? 'R' : (state==='3' ? 'P' : null);
  currentFilteredGames = want ? games.filter(g=>g.gameType===want) : games;
  buildMonthMeta(seasons);
  renderCurrentMonth(team);
}

function buildMonthMeta(selectedSeasons=[]){
  const set = new Set();
  monthMeta = [];
  currentFilteredGames.forEach(g=>{
    if(!g.date) return; const d = new Date(g.date); if(isNaN(d)) return; const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!set.has(key)){
      set.add(key);
      monthMeta.push({key, year:d.getFullYear(), month:d.getMonth(), label: d.toLocaleString('default',{month:'long'})+ ' '+ d.getFullYear()});
    }
  });
  monthMeta.sort((a,b)=> a.year===b.year? a.month-b.month : a.year-b.year);
  const seasons = Array.isArray(selectedSeasons) ? selectedSeasons.filter(season => /^\d{8}$/.test(String(season || '').trim())) : [];
  if(seasons.length > 1){
    currentMonthIndex = 0;
  }else{
    // Choose month containing today if present else first
    const today = new Date();
    const todayKey = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
    const idx = monthMeta.findIndex(m=>m.key===todayKey);
    currentMonthIndex = idx>=0? idx : 0;
  }
  buildMonthControls();
}

function buildMonthControls(){
  const mc = document.getElementById('monthControls');
  if(!mc) return;
  if(!monthMeta.length){ mc.innerHTML=''; return; }

  const meta = monthMeta[currentMonthIndex];

  const prevBtn = document.createElement('button');
  prevBtn.type = 'button';
  prevBtn.className = 'month-nav-btn';
  prevBtn.setAttribute('aria-label', 'Previous month');
  prevBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>';
  prevBtn.disabled = currentMonthIndex === 0;
  prevBtn.onclick = ()=>{ if(currentMonthIndex > 0){ currentMonthIndex--; renderCurrentMonth(teamSelect.value); buildMonthControls(); } };

  const nextBtn = document.createElement('button');
  nextBtn.type = 'button';
  nextBtn.className = 'month-nav-btn next';
  nextBtn.setAttribute('aria-label', 'Next month');
  nextBtn.innerHTML = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
  nextBtn.disabled = currentMonthIndex === monthMeta.length - 1;
  nextBtn.onclick = ()=>{ if(currentMonthIndex < monthMeta.length - 1){ currentMonthIndex++; renderCurrentMonth(teamSelect.value); buildMonthControls(); } };

  const wrap = document.createElement('div');
  wrap.className = 'month-title-wrap';

  const titleBtn = document.createElement('button');
  titleBtn.type = 'button';
  titleBtn.className = 'month-title-btn';
  titleBtn.setAttribute('aria-haspopup', 'listbox');
  titleBtn.setAttribute('aria-expanded', 'false');

  const label = document.createElement('span');
  label.className = 'month-title-label';
  label.textContent = meta ? meta.label : '';

  const chev = document.createElement('svg');
  chev.classList.add('chev');
  chev.setAttribute('viewBox', '0 0 24 24');
  chev.setAttribute('fill', 'none');
  chev.setAttribute('stroke', 'currentColor');
  chev.setAttribute('stroke-width', '2.5');
  chev.setAttribute('stroke-linecap', 'round');
  chev.setAttribute('stroke-linejoin', 'round');
  chev.innerHTML = '<path d="M6 9l6 6 6-6"/>';

  titleBtn.appendChild(label);
  titleBtn.appendChild(chev);

  const menu = document.createElement('div');
  menu.className = 'month-menu';
  menu.setAttribute('role', 'listbox');
  menu.hidden = true;
  monthMeta.forEach((m, i)=>{
    const item = document.createElement('button');
    item.type = 'button';
    item.textContent = m.label;
    if(i === currentMonthIndex) item.classList.add('active');
    item.onclick = ()=>{
      menu.hidden = true;
      titleBtn.setAttribute('aria-expanded', 'false');
      if(i !== currentMonthIndex){
        currentMonthIndex = i;
        renderCurrentMonth(teamSelect.value);
        buildMonthControls();
      }
    };
    menu.appendChild(item);
  });

  wrap.appendChild(titleBtn);
  wrap.appendChild(menu);

  titleBtn.onclick = ()=>{
    const open = menu.hidden;
    menu.hidden = !open;
    titleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
  };

  mc.innerHTML = '';
  mc.appendChild(prevBtn);
  mc.appendChild(wrap);
  mc.appendChild(nextBtn);

  // Close the menu when clicking outside
  if(typeof __monthMenuDocHandler === 'function') document.removeEventListener('click', __monthMenuDocHandler);
  __monthMenuDocHandler = (e)=>{
    if(menu.hidden) return;
    if(wrap.contains(e.target)) return;
    menu.hidden = true;
    titleBtn.setAttribute('aria-expanded', 'false');
  };
  document.addEventListener('click', __monthMenuDocHandler);
}

function handleSeasonStateAvailability(){ loadSchedule(); }

// Monday-first month builder
function getMondayStartOffset(jsDow){
  // jsDow: 0=Sun ... 6=Sat -> want 0 for Mon
  return (jsDow+6)%7; // Sun(0)->6, Mon(1)->0,...
}

function buildMonth(year, month, games, team){
  const first=new Date(year,month,1); const startDow=getMondayStartOffset(first.getDay());
  const days=new Date(year, month+1,0).getDate();
  const teamRow = teams.find(t=>t.Team===team);
  const baseColor = teamRow?teamRow.Color:'#1d2735';
  const light = lightenDarken(baseColor, isLight(baseColor)?0.6:1.6);
  const dark = lightenDarken(baseColor, isLight(baseColor)?0.35:0.8);
  let html=`<div class="month-container">`;
  html+='<div class="day-names">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div>${d}</div>`).join('')+'</div>';
  html+='<div class="calendar-grid">';
  for(let i=0;i<startDow;i++){ html+='<div class="game-tile empty"></div>'; }
  for(let day=1; day<=days; day++){
    const dateGames = games.filter(g=>g._dateObj.getDate()==day);
    if(!dateGames.length){ html+=`<div class="game-tile"><div class="game-date">${day}</div></div>`; continue; }
    // Only first game shown succinctly; could extend
    const g=dateGames[0];
    const opp = g.opponent;
    const isHome = g.is_home;
    const tileColor = isHome? light : dark;
    const label = isHome? 'vs ' + opp : 'at ' + opp;
    const status = g.status || '';
    // Score / outcome
    let scoreLine='';
  const statusUp = (g.status||'').toUpperCase();
  const haveScores = g.home_score!=null && g.away_score!=null && (statusUp.includes('FINAL') || statusUp==='OFF');
    if(haveScores){
      const teamScore = isHome? g.home_score : g.away_score;
      const oppScore = isHome? g.away_score : g.home_score;
      let outcome='';
      if(teamScore>oppScore) outcome='W';
      else if(teamScore<oppScore){
        const lpt = (g.lastPeriodType||'').toUpperCase();
        if(lpt==='SO' || lpt==='SHOOTOUT') outcome='SOL';
        else if(lpt==='OT') outcome='OTL';
        else outcome='L';
      } else if(teamScore===oppScore) {
        outcome='T';
      }
      scoreLine = `${outcome} ${teamScore}-${oppScore}`.trim();
    }
    const oppLogo = (teams.find(t=>t.Team===opp)||{}).Logo || '';
    const gameLink = `/game/${g.id}`;
    html+=`<a href="${gameLink}" class="game-tile ${isHome?'home':'away'}" style="background:${tileColor}; color:${isLight(tileColor)?'#081018':'#f1f5f9'}; text-decoration:none;">
      <div class="bg-logo" style="background-image:url('${oppLogo}')"></div>
      <div class="game-date">${day}</div>
      <div class="matchup">${label}</div>
      ${scoreLine?`<div class="score-line">${scoreLine}</div>`:''}
      <div class="status-chip">${status}</div>
    </a>`;
  }
  html+='</div></div>';
  return html;
}

function buildMonthTable(games, team){
  const teamRow = teams.find(t=>t.Team===team);
  const baseColor = teamRow?teamRow.Color:'#1d2735';
  const homeColor = lightenDarken(baseColor, isLight(baseColor)?0.6:1.6);
  const awayColor = lightenDarken(baseColor, isLight(baseColor)?0.35:0.8);

  const rows = (games||[]).slice().sort((a,b)=>{
    const da = a? a._dateObj : null;
    const db = b? b._dateObj : null;
    return (da?da.getTime():0) - (db?db.getTime():0);
  });

  const fmt = (d)=>{
    try{ return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' }); }
    catch(_){ return String(d); }
  };

  const body = rows.map(g=>{
    const d = g._dateObj;
    const opp = g.opponent;
    const isHome = !!g.is_home;
    const status = String(g.status||'').trim();
    const statusUp = status.toUpperCase();
    const haveScores = g.home_score!=null && g.away_score!=null && (statusUp.includes('FINAL') || statusUp==='OFF');
    let score = '';
    if(haveScores){
      const teamScore = isHome? g.home_score : g.away_score;
      const oppScore = isHome? g.away_score : g.home_score;
      let outcome='';
      if(teamScore>oppScore) outcome='W';
      else if(teamScore<oppScore){
        const lpt = (g.lastPeriodType||'').toUpperCase();
        if(lpt==='SO' || lpt==='SHOOTOUT') outcome='SOL';
        else if(lpt==='OT') outcome='OTL';
        else outcome='L';
      } else outcome='T';
      score = `${outcome} ${teamScore}-${oppScore}`.trim();
    }
    const label = isHome? `vs ${opp}` : `at ${opp}`;
    const bg = isHome? homeColor : awayColor;
    const fg = isLight(bg)? '#081018' : '#f1f5f9';
    const gameLink = `/game/${g.id}`;
    return `
      <tr class="schedule-row" data-href="${gameLink}" tabindex="0" style="background:${bg}; color:${fg};">
        <td>${d && !isNaN(d) ? fmt(d) : ''}</td>
        <td>${label}</td>
        <td><span class="chip">${status || '—'}</span></td>
        <td class="num">${score || '—'}</td>
      </tr>`;
  }).join('');

  return `
    <div class="schedule-table-wrap">
      <table class="schedule-table">
        <thead>
          <tr>
            <th style="width:120px;">Date</th>
            <th>Matchup</th>
            <th style="width:130px;">Status</th>
            <th style="width:110px; text-align:right;">Result</th>
          </tr>
        </thead>
        <tbody>${body || ''}</tbody>
      </table>
    </div>`;
}

function renderCurrentMonth(team){
  if(!currentFilteredGames.length){
    if(scheduleGridRoot) scheduleGridRoot.innerHTML='<p>No games.</p>';
    if(scheduleTableRoot) scheduleTableRoot.innerHTML='<p>No games.</p>';
    return;
  }
  if(!monthMeta.length){
    if(scheduleGridRoot) scheduleGridRoot.innerHTML='<p>No games.</p>';
    if(scheduleTableRoot) scheduleTableRoot.innerHTML='<p>No games.</p>';
    return;
  }
  const meta = monthMeta[currentMonthIndex];
  const games = currentFilteredGames.map(g=>{ const d=new Date(g.date); return {...g, _dateObj:d}; }).filter(g=> g._dateObj.getFullYear()==meta.year && g._dateObj.getMonth()==meta.month);
  if(scheduleGridRoot) scheduleGridRoot.innerHTML = buildMonth(meta.year, meta.month, games, team);
  if(scheduleTableRoot) scheduleTableRoot.innerHTML = buildMonthTable(games, team);
  renderLegend(team);
}

// Mobile schedule table: make entire row clickable
let __scheduleRowNavBound = false;
function bindScheduleRowNav(){
  if(__scheduleRowNavBound || !scheduleTableRoot) return;
  __scheduleRowNavBound = true;
  scheduleTableRoot.addEventListener('click', (e)=>{
    const tr = e.target && e.target.closest ? e.target.closest('tr[data-href]') : null;
    if(!tr) return;
    // ignore clicks on real links if any appear
    if(e.target && e.target.closest && e.target.closest('a')) return;
    const href = tr.getAttribute('data-href');
    if(href) window.location.href = href;
  });
  scheduleTableRoot.addEventListener('keydown', (e)=>{
    const key = e.key || '';
    if(key !== 'Enter' && key !== ' ') return;
    const tr = e.target && e.target.closest ? e.target.closest('tr[data-href]') : null;
    if(!tr) return;
    e.preventDefault();
    const href = tr.getAttribute('data-href');
    if(href) window.location.href = href;
  });
}

function renderLegend(team){
  const el = document.getElementById('scheduleLegend');
  if(!el) return;
  const teamRow = teams.find(t=>t.Team===team);
  const base = teamRow?teamRow.Color:'#1d2735';
  const light = lightenDarken(base, isLight(base)?0.6:1.6);
  const dark = lightenDarken(base, isLight(base)?0.35:0.8);
  el.innerHTML = `<span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:22px;height:22px;border-radius:6px;background:${light};border:1px solid rgba(255,255,255,.15);"></span>Home</span>
  <span style="display:inline-flex; align-items:center; gap:8px;"><span style="width:22px;height:22px;border-radius:6px;background:${dark};border:1px solid rgba(255,255,255,.15);"></span>Away</span>`;
}

// Global init handles theme and data population; ensure schedule loads after meta.
seasonStateSelect && seasonStateSelect.addEventListener('change', ()=> loadSchedule());
bindScheduleRowNav();
setTimeout(()=> loadSchedule(), 600);
</script>
{% endblock %}
