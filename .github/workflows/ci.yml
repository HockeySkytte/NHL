name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Static syntax checks
        run: |
          python -m py_compile app/__init__.py app/routes.py
          python -m compileall -q app tests scripts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          XG_PRELOAD: '0'
          PRESTART_LOGGER: '0'
          PRELOAD_GM_CACHES: '0'
        run: |
          python -m pytest -q tests

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            nhl_rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('nhl_rust/Cargo.lock') }}

      # The xG model resolution in nhl_rust/src/models/xg.rs decides which
      # exported model scores a game; a regression there silently zeroes every
      # game report's xGF/xGA, so it is worth its own job.
      - name: Run Rust tests
        working-directory: nhl_rust
        run: cargo test --locked
