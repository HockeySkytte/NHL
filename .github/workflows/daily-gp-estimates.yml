name: Daily Estimated Games refresh

# Keeps the Estimated Games (gp_est) used by the season simulations current.
#
# This is deliberately separate from the 30-minute lineup refresh: gp_est comes
# from a per-player NHL career-stats fetch (~800 requests), so it runs once a
# day while the lineup scrape runs every 30 minutes and simply carries the
# existing estimates forward.

on:
  schedule:
    # 13:10 UTC — after the daily data update at 11:00 UTC, and offset from the
    # :00/:30 lineup refresh.
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season code (e.g. 20262027). Leave blank to derive from today."
        required: false

permissions:
  contents: read

concurrency:
  # Shared with update-lineups.yml: both delete + re-upsert the same season's
  # `lineups` rows, so they must never run at the same time.
  group: lineups-write
  cancel-in-progress: false

jobs:
  estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      XG_PRELOAD: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve season
        id: params
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(python scripts/season_for_date.py)
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "Resolved season=$SEASON"

      # Fresh scrape first so the estimates are computed against the current
      # line combinations rather than the snapshot committed in the repo.
      - name: Scrape projected line combinations
        run: |
          python -u scripts/lineups.py --all --quiet \
            --season "${{ steps.params.outputs.season }}" \
            --out-all app/static/lineups_all.json

      - name: Recompute Estimated Games
        run: |
          python -u scripts/estimate_gp.py

      - name: Upload lineups + Estimated Games to Supabase
        run: |
          python -u scripts/upload_lineups.py \
            --season "${{ steps.params.outputs.season }}"
