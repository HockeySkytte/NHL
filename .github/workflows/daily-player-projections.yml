name: Daily player projections update

on:
  schedule:
    # Every day at 18:00 UTC, after Moncton source data is expected to be available.
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season code to export (e.g. 20262027). Leave blank for the newest season the source has games for."
        required: false

permissions:
  contents: read

concurrency:
  group: daily-player-projections
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATABASE_MONCTON_URL: ${{ secrets.DATABASE_MONCTON_URL }}
      XG_PRELOAD: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export player-game projections
        run: |
          SEASON="${{ inputs.season }}"
          if [ -n "$SEASON" ]; then
            SEASON_ARG="--season $SEASON"
            echo "Exporting season $SEASON"
          else
            # Target the newest season the source actually has games for rather
            # than the calendar season: the Moncton `games` table lags its
            # player-stats tables at the start of a season, so pinning the new
            # season made this step fail with "No projections were generated".
            SEASON_ARG="--latest-season"
          fi
          python -u scripts/export_preseason_updating_player_projections.py \
            $SEASON_ARG \
            --skip-ensure-table \
            --refresh-data \
            --refresh-player-cache

      - name: Export current player projections
        run: |
          python -u scripts/export_current_player_projections.py \
            --skip-ensure-table