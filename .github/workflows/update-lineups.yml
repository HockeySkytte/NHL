name: Lineup refresh (every 30 min)

on:
  schedule:
    # Every 30 minutes — projected line combinations move close to puck drop.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season code (e.g. 20262027). Leave blank to derive from today."
        required: false

permissions:
  contents: read

concurrency:
  # Shared with daily-gp-estimates.yml: both delete + re-upsert the same
  # season's `lineups` rows, so they must never run at the same time.
  group: lineups-write
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      XG_PRELOAD: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve season
        id: params
        run: |
          SEASON="${{ inputs.season }}"
          if [ -z "$SEASON" ]; then
            SEASON=$(python scripts/season_for_date.py)
          fi
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"
          echo "Resolved season=$SEASON"

      # Scraping overwrites lineups_all.json, which is also the file
      # scripts/estimate_gp.py writes Estimated Games into. lineups.py carries
      # gp_est/gp_est_note forward per (team, playerId) so this 30-minute loop
      # never disturbs the season simulations' games-played weighting.
      - name: Scrape projected line combinations
        run: |
          python -u scripts/lineups.py --all --quiet \
            --season "${{ steps.params.outputs.season }}" \
            --out-all app/static/lineups_all.json 2>&1 | tee /tmp/scrape.log
          # Surface the scrape size as an annotation: a blocked or throttled
          # DailyFaceoff returns fast with almost nothing, which is otherwise
          # invisible from the run summary.
          python - <<'PY'
          import json
          data = json.load(open("app/static/lineups_all.json", encoding="utf-8"))
          total = sum(
              len(data.get(t, {}).get(g) or [])
              for t in data
              for g in ("forwards", "defense", "goalies")
          )
          empty = [t for t in data if not any((data[t].get(g) or []) for g in ("forwards", "defense", "goalies"))]
          print(f"::notice::scraped {total} players across {len(data)} teams; empty teams: {empty or 'none'}")
          PY

      # upload_lineups.py also falls back to the stored estimated_gp for any
      # player the scrape produced without an estimate, so the Supabase rows
      # keep their Estimated Games even if the JSON snapshot is missing them.
      - name: Upload lineups to Supabase
        run: |
          set +e
          python -u scripts/upload_lineups.py \
            --season "${{ steps.params.outputs.season }}" 2>&1 | tee /tmp/upload.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg=$(grep -iE '\[error\]|refus|error:' /tmp/upload.log | tail -n 1)
            echo "::error::lineup upload failed (exit $rc): ${msg:-see log}"
          fi
          exit "$rc"
